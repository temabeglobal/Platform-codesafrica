# Render — sites de la plateforme (statiques, construits depuis client/) : test puis production.
# Chaque site n'utilise que sa branche Neon : « test » pour le site de test, « production » pour la production.
# Les valeurs ci-dessous sont des adresses publiques (aucun secret).
services:
  - type: web
    runtime: static
    name: codesafrica-planning-test
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build:test
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_NEON_TEST_AUTH_URL
        value: https://ep-solitary-silence-bdtnyc3f.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth
      - key: VITE_NEON_TEST_API_URL
        value: https://br-holy-shadow-bduosnae-api.compute.c-8.us-east-2.aws.neon.tech
      - key: VITE_NEON_TEST_REALTIME_URL
        value: wss://ep-solitary-silence-bdtnyc3f.rt.c-8.us-east-2.aws.neon.tech/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex

  # Render — site de PRODUCTION (vrais utilisateurs), branché sur la branche Neon « production » uniquement.
  # Ne se publie qu'avec l'accord explicite de l'utilisateur, après passage par le local et le test.
  - type: web
    runtime: static
    name: codesafrica-planning
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build:prod
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_NEON_PROD_AUTH_URL
        value: https://ep-orange-wildflower-bdd3bw8d.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth
      - key: VITE_NEON_PROD_API_URL
        value: https://br-cool-dream-bdvckt3j-api.compute.c-8.us-east-2.aws.neon.tech
      - key: VITE_NEON_PROD_REALTIME_URL
        value: wss://ep-orange-wildflower-bdd3bw8d.rt.c-8.us-east-2.aws.neon.tech/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
